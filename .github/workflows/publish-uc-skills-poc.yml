name: Publish UC skills POC
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate folders only (disable after configuring Databricks authentication)
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: uc-skills-staging-poc
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, linux, x64, uc-skills-poc]
    environment: staging
    env:
      # Trust the connected runner machine's installed corporate CA bundle.
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      DATABRICKS_AUTH_TYPE: oauth-m2m
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      UC_SKILLS_SCHEMA: ${{ vars.UC_SKILLS_SCHEMA || 'acme.team_skills' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Map every source skill folder
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('skills-poc.yaml').write_text(json.dumps({
              'version': 1,
              'directories': [{'path': 'skills', 'schema': os.environ['UC_SKILLS_SCHEMA']}]
          }))
          PY
      # Tested POC release, pinned to its commit.
      - uses: sunishsheth2009/uc-skills-action@97129de1ab3f0cf7df01f7b51efa0427b4c36d8f
        id: skills
        with:
          mapping-file: skills-poc.yaml
          dry-run: ${{ inputs.dry_run }}
          prune-files: 'true'
      - name: Upload publishing report
        if: always() && steps.skills.outputs.report-file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uc-skills-poc-report
          path: ${{ steps.skills.outputs.report-file }}
